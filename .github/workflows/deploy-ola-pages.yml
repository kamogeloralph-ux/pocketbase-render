name: Deploy OLA to Cloudflare Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy production site and Pages Function
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract OLA deployment package
        run: unzip -o ola-impact-resend-wrangler-deploy.zip -d deploy

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy to the existing Cloudflare Pages project
        working-directory: deploy
        run: npx --yes wrangler@4 pages deploy dist --project-name ola --branch main
        env:
          CLOUDFLARE_ACCOUNT_ID: 33d3042ef8eb068461919506f3d45e06
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
